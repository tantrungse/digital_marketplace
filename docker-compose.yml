version: '3'

services:
  web:
    build: .
    ports:
      - "3000:3000"
      - "4000:4000"
    volumes:
      - .:/usr/src/app
      # - gem_cache:/gems
    env_file:
      - .env/development/web
      - .env/development/database
  redis:
    image: redis
  database:
    image: postgres
    ports:
      - "5433:5432"
    env_file:
      - .env/development/database
    volumes:
      - db_data:/var/lib/postgresql/data
  selenium_chrome:
    image: selenium/standalone-chrome-debug
    logging:
      driver: none
    ports:
      - "5900:5900"
volumes:
  db_data:
  # gem_cache:
